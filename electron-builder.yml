appId: me.limboy.basedata
productName: BaseData
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!cli/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.*.json,components.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asar: true
# GitHub is the update feed for electron-updater (added later): each publish
# uploads latest-mac.yml alongside the zip, which is what autoUpdater polls.
publish:
  provider: github
  owner: limboy
  repo: basedata
  # Release publishes immediately when CI succeeds — no manual "Publish release"
  # click. A passing build (incl. signing/notarization) goes live automatically.
  releaseType: release
mac:
  target:
    # zip is required by electron-updater's Squirrel.Mac; dmg is for manual installs.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.icns
dmg:
  artifactName: ${name}-${version}.${ext}
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
